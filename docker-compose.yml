version: "3.9"

services:
  produtos:
    build: ./produtos_service
    container_name: produtos_service
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - shoopnet

  compras:
    build: ./compras_service
    container_name: compras_service
    ports:
      - "8002:8002"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - shoopnet

  pagamentos:
    build: ./pagamentos_service
    container_name: pagamentos_service
    ports:
      - "8001:8001"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - shoopnet

  notificacoes:
    build: ./notificacao_service
    container_name: notificacao_service
    ports:
      - "8003:8003"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - shoopnet

  shoop_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoop_api
    ports:
      - "8080:8080"
    depends_on:
      - produtos
      - pagamentos
      - notificacoes
      - db
    restart: unless-stopped
    networks:
      - shoopnet

  db:
    image: postgres:16
    container_name: shoop_db
    environment:
      POSTGRES_USER: marco
      POSTGRES_PASSWORD: marco123
      POSTGRES_DB: shoopdb
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - shoopnet

volumes:
  pgdata:

networks:
  shoopnet:
